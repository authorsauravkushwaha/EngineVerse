name: GitHub Pages

# Publishes the sign-in gateway. Sign-in is compulsory on EngineVerse and
# GitHub Pages cannot run accounts, so Pages carries no notes, questions or
# answers: only a landing page whose buttons (and any old deep link) go to the
# hosted app's /login. It does not deploy the Python app, a database, or the
# code judge.
#
# Set the hosted app's https address as the repository variable
# ENGINEVERSE_APP_URL (Settings -> Secrets and variables -> Actions ->
# Variables). Until it is set, the page says the app is not hosted yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the exporter
        run: python scripts/export_pages.py --self-check

      - name: Write the sign-in gateway
        env:
          ENGINEVERSE_APP_URL: ${{ vars.ENGINEVERSE_APP_URL }}
        run: python scripts/export_pages.py --out site

      - name: Refuse leaked demo passwords
        run: |
          if grep -R -n -E 'LearnBuild#2026!|TeachLearn#2026!|Str0ngPassphrase#42!' site; then
            echo "refusing to publish demo passwords"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
